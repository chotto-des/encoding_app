services:
  app: # <-- You can name this whatever you want, but you will have to change the /vm/ngix/conf.d/default.conf
    image: haroldcris/php8.2.4
    container_name: php
    working_dir: /var/www/laravel   
    restart: unless-stopped
    volumes:
      - ./vm/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./code/laravel:/var/www/laravel
    #build:
    #  context: ./vm/php
    #  dockerfile: Dockerfile
    networks:
      - laravel_network


  webserver:  # <-- You can name this whatever you want
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - ${APP_PORT}:80
    volumes:
      - ./vm/nginx/conf.d:/etc/nginx/conf.d/
      - ./code:/var/www
    networks:
      - laravel_network
      


  adminer: # <-- You can name this whatever you want
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - laravel_network

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
    ports:
      - "3307:3306"
    volumes:
      - ./db/mysql:/var/lib/mysql
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge